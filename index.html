
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEJ NAZAR NEWS | तेज़ नज़र न्यूज़</title>
<meta property="og:title" content="TEJ NAZAR NEWS">
<meta property="og:description" content="हर खबर पर तेज़ नज़र">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f6;color:#172033;font-family:system-ui,sans-serif}
header,footer{text-align:center;background:#b90000;color:white;padding:20px}
header img{width:90px;max-height:90px;object-fit:contain}
h1{margin:8px 0}
nav,footer{background:#10234b;color:white;text-align:center;padding:14px}
main{max-width:900px;margin:auto;padding:12px}
section,article{background:white;padding:16px;margin:12px 0;border-radius:10px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:6px;font:inherit}
textarea{min-height:150px}
button{background:#b90000;color:white;border:0;border-radius:6px;padding:12px;margin:4px;cursor:pointer;font:inherit}
button:disabled{opacity:.5}
article img,video{width:100%;max-height:480px;object-fit:contain}
article p{white-space:pre-wrap;line-height:1.7}
[hidden]{display:none!important}
#message{position:sticky;top:0;z-index:2;border:2px solid #10234b}
.wa{background:#168c48}
.fb{background:#1877f2}
.ig{background:#c13584}
.x{background:#111}
</style>
</head>
<body>

<header>
<img src="logo.png" alt="TEJ NAZAR NEWS लोगो" onerror="this.hidden=true">
<h1>TEJ NAZAR NEWS</h1>
<h2>तेज़ नज़र न्यूज़</h2>
हर खबर पर तेज़ नज़र
</header>

<nav>गिरिडीह | झारखंड | ताज़ा समाचार</nav>

<main>
<section id="message" hidden role="status"></section>

<section>
<h2>ताज़ा खबरें</h2>
<div id="publicNews">लोड हो रहा है...</div>
</section>

<section id="loginPanel">
<h2>रिपोर्टर / एडमिन लॉगिन</h2>
<input id="email" type="email" placeholder="ईमेल">
<input id="password" type="password" placeholder="पासवर्ड">
<button id="loginBtn">लॉगिन करें</button>
</section>

<section id="reporterPanel" hidden>
<p id="userInfo"></p>
<button id="logoutBtn">लॉगआउट</button>
<h2>खबर भेजें</h2>
<input id="headline" maxlength="250" placeholder="खबर का शीर्षक">
<textarea id="body" maxlength="50000" placeholder="पूरी खबर"></textarea>

<label>फोटो (अधिकतम 10 MB)
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
</label>

<label>वीडियो (MP4/WebM, अधिकतम 100 MB)
<input id="video" type="file" accept="video/mp4,video/webm">
</label>

<button id="sendBtn">मंजूरी के लिए भेजें</button>
<h2>मेरी खबरें</h2>
<div id="myNews"></div>
</section>

<section id="adminPanel" hidden>
<h2>एडमिन डैशबोर्ड</h2>
<button data-status="pending">Pending</button>
<button data-status="published">Published</button>
<button data-status="rejected">Rejected</button>
<div id="adminNews"></div>
</section>
</main>

<footer>
TEJ NAZAR NEWS | गिरिडीह<br>
सर्वाधिकार सुरक्षित
</footer>

<script type="module">

import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';

import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';

import {getFirestore,collection,doc,setDoc,getDocs,query,where,updateDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

import {getStorage,ref,uploadBytes,getBlob} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js';

const app=initializeApp({
apiKey:'AIzaSyBPsFE0AItJUnRrKh3G78JMiMnmhTzukNM',
authDomain:'tejnazarnews-f17b3.firebaseapp.com',
projectId:'tejnazarnews-f17b3',
storageBucket:'tejnazarnews-f17b3.firebasestorage.app',
messagingSenderId:'776903715743',
appId:'1:776903715743:web:487cdac0caddaeb55febaa'
});

const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);
const ADMIN_UID='DR1BytS92VenNWCBce48XY09e123';
const $=id=>document.getElementById(id);

let status='pending';
const listVersion={};

function msg(t){
$('message').hidden=false;
$('message').textContent=t;
}

function button(t,f,c=''){
const b=document.createElement('button');
b.textContent=t;
b.onclick=f;
b.className=c;
return b;
}

function el(tag,t){
const e=document.createElement(tag);
e.textContent=t;
return e;
}

function openLink(u){
window.open(u,'_blank','noopener');
}

function card(d,share=false){
const n=d.data();
const a=document.createElement('article');
const title=n.title||n.headline||'समाचार';
const body=n.body||n.content||n.description||'';

if(share)a.id='news-'+d.id;
a.append(el('h3',title));

for(const [field,tag] of [['photoPath','img'],['videoPath','video']]){
if(n[field]){
const m=document.createElement(tag);

if(tag==='video'){
m.controls=true;
m.preload='metadata';
}else{
m.alt=title;
}

a.append(m);

getBlob(ref(storage,n[field])).then(blob=>{
if(m.isConnected)m.src=URL.createObjectURL(blob);
}).catch(()=>{
m.replaceWith(el('p','मीडिया लोड नहीं हुआ'));
});
}
}

a.append(el('p',body));

if(share){
const url=location.href.split('#')[0]+'#news-'+d.id;
const text=title+'\n'+body+'\n'+url;

a.append(
button('WhatsApp',()=>openLink('https://wa.me/?text='+encodeURIComponent(text)),'wa'),

button('Facebook',()=>openLink('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url)),'fb'),

button('Instagram कॉपी',async()=>{
try{
await navigator.clipboard.writeText(text);
msg('खबर कॉपी हो गई। Instagram में पेस्ट करें।');
}catch(e){
msg(e.message);
}
},'ig'),

button('X',()=>openLink('https://twitter.com/intent/tweet?text='+encodeURIComponent(title)+'&url='+encodeURIComponent(url)),'x')
);

}else{
a.append(el('p','स्थिति: '+n.status));
}

return a;
}

async function list(id,field,value,mode){

const box=$(id);
const version=(listVersion[id]||0)+1;
listVersion[id]=version;

try{

const s=await getDocs(
query(collection(db,'news'),where(field,'==',value))
);

if(listVersion[id]!==version)return;

box.replaceChildren();

if(s.empty){
box.textContent='कोई खबर नहीं है।';
return;
}

const seen=new Set();

const docs=s.docs.sort((a,b)=>
(b.data().publishedAt?.seconds||b.data().createdAt?.seconds||0)-
(a.data().publishedAt?.seconds||a.data().createdAt?.seconds||0)
);

for(const d of docs){

if(seen.has(d.id))continue;
seen.add(d.id);

const a=card(d,mode==='public');

if(mode==='admin'&&value==='pending'){

for(const [label,next] of [
['प्रकाशित करें','published'],
['अस्वीकार करें','rejected']
]){

const action=button(label,async()=>{

if(auth.currentUser?.uid!==ADMIN_UID){
return msg('एडमिन की अनुमति जरूरी है।');
}

const buttons=a.querySelectorAll('button');
buttons.forEach(b=>b.disabled=true);

try{

await updateDoc(d.ref,
next==='published'
?{status:next,publishedAt:serverTimestamp()}
:{status:next}
);

msg('स्थिति: '+next);
await refresh();

}catch(e){
msg(e.message);
buttons.forEach(b=>b.disabled=false);
}

});

a.append(action);
}
}

box.append(a);
}

if(mode==='public'&&location.hash){
document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

}catch(e){
if(listVersion[id]===version){
box.textContent=e.message;
}
}
}

async function refresh(){

const u=auth.currentUser;

await Promise.all([
list('publicNews','status','published','public'),
u?list('myNews','authorUid',u.uid,'mine'):null,
u?.uid===ADMIN_UID?list('adminNews','status',status,'admin'):null
]);

}

document.querySelectorAll('[data-status]').forEach(b=>{
b.onclick=()=>{
status=b.dataset.status;
refresh();
};
});

$('loginBtn').onclick=async()=>{

$('loginBtn').disabled=true;

try{

await signInWithEmailAndPassword(
auth,
$('email').value.trim(),
$('password').value
);

$('password').value='';
msg('लॉगिन सफल');

}catch(e){
msg(e.message);
}finally{
$('loginBtn').disabled=false;
}

};

$('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{

listVersion.myNews=(listVersion.myNews||0)+1;
listVersion.adminNews=(listVersion.adminNews||0)+1;

$('loginPanel').hidden=!!u;
$('reporterPanel').hidden=!u;
$('adminPanel').hidden=u?.uid!==ADMIN_UID;

$('myNews').replaceChildren();
$('adminNews').replaceChildren();

$('userInfo').textContent=u?.email||'';

refresh();

});

$('sendBtn').onclick=async()=>{

if($('sendBtn').disabled)return;

const u=auth.currentUser;
const title=$('headline').value.trim();
const body=$('body').value.trim();

if(!u||!title||!body){
return msg('लॉगिन, शीर्षक और खबर जरूरी हैं।');
}

const photo=$('photo').files[0];
const video=$('video').files[0];

if(photo&&(
!['image/jpeg','image/png','image/webp'].includes(photo.type)
||photo.size>10*1024*1024
)){
return msg('फोटो का प्रकार या आकार गलत है।');
}

if(video&&(
!['video/mp4','video/webm'].includes(video.type)
||video.size>100*1024*1024
)){
return msg('वीडियो का प्रकार या आकार गलत है।');
}

$('sendBtn').disabled=true;

try{

const d=doc(collection(db,'news'));

const n={
title,
body,
content:body,
authorUid:u.uid,
status:'pending',
createdAt:serverTimestamp()
};

for(const [f,key,name] of [
[photo,'photoPath','photo'],
[video,'videoPath','video']
]){

if(f){

msg('मीडिया अपलोड हो रहा है...');

const path='newsMedia/'+u.uid+'/'+d.id+'/'+name;

await uploadBytes(
ref(storage,path),
f,
{contentType:f.type}
);

n[key]=path;

}
}

await setDoc(d,n);

for(const id of ['headline','body','photo','video']){
$(id).value='';
}

msg('खबर मंजूरी के लिए भेज दी गई।');

await refresh();

}catch(e){

msg('खबर भेजने में समस्या: '+e.message);

}finally{

$('sendBtn').disabled=false;

}

};

</script>
</body>
</html>
