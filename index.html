
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEJ NAZAR NEWS | तेज़ नज़र न्यूज़</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f6;color:#172033;font-family:Arial,sans-serif}
header{background:#b90000;color:white;text-align:center;padding:22px}
header h1{margin:0;font-size:30px}
nav{background:#10234b;color:white;text-align:center;padding:12px}
main{max-width:900px;margin:auto;padding:14px}
section,article{background:white;padding:18px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font:inherit}
textarea{min-height:150px}
button{background:#b90000;color:white;border:0;border-radius:7px;padding:12px 15px;margin:5px 3px;cursor:pointer;font:inherit}
button:disabled{opacity:.5}
.whatsapp{background:#168c48}
.facebook{background:#1877f2}
.instagram{background:#c13584}
.twitter{background:#111}
.error{color:#b90000}
.newsbody{white-space:pre-wrap;line-height:1.7}
footer{text-align:center;background:#10234b;color:white;padding:20px}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
<h1>TEJ NAZAR NEWS</h1>
<h2>तेज़ नज़र न्यूज़</h2>
<p>हर खबर पर तेज़ नज़र</p>
</header>

<nav>गिरिडीह | झारखंड | ताज़ा समाचार</nav>

<main>

<section>
<h2>ताज़ा खबरें</h2>
<div id="publicNews">खबरें लोड हो रही हैं...</div>
</section>

<section id="loginPanel">
<h2>रिपोर्टर / एडमिन लॉगिन</h2>
<input id="email" type="email" placeholder="ईमेल">
<input id="password" type="password" placeholder="पासवर्ड">
<button id="loginBtn">लॉगिन करें</button>
</section>

<section id="reporterPanel" hidden>
<p id="userInfo"></p>
<button id="logoutBtn">लॉगआउट</button>

<h2>खबर भेजें</h2>
<input id="headline" placeholder="खबर का शीर्षक">
<textarea id="body" placeholder="पूरी खबर लिखें"></textarea>
<button id="sendBtn">मंजूरी के लिए भेजें</button>

<h2>मेरी भेजी खबरें</h2>
<div id="myNews"></div>
</section>

<section id="adminPanel" hidden>
<h2>एडमिन पैनल</h2>
<div id="pendingNews"></div>
</section>

<section id="message" hidden></section>

</main>

<footer>
TEJ NAZAR NEWS | गिरिडीह<br>
सर्वाधिकार सुरक्षित
</footer>

<script type="module">

import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
doc,
updateDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBPsFE0AItJUnRrKh3G78JMiMnmhTzukNM",
authDomain:"tejnazarnews-f17b3.firebaseapp.com",
projectId:"tejnazarnews-f17b3",
storageBucket:"tejnazarnews-f17b3.firebasestorage.app",
messagingSenderId:"776903715743",
appId:"1:776903715743:web:487cdac0caddaeb55febaa"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const ADMIN_UID="DR1BytS92VenNWCBce48XY09e123";

const $=id=>document.getElementById(id);

function message(text,error=false){
$("message").hidden=false;
$("message").textContent=text;
$("message").className=error?"error":"";
}

function makeButton(label,fn,cls=""){
const b=document.createElement("button");
b.textContent=label;
b.className=cls;
b.onclick=fn;
return b;
}

function newsCard(id,n,share=false){
const a=document.createElement("article");
a.id="news-"+id;

const h=document.createElement("h3");
h.textContent=n.title||n.headline||"समाचार";
a.appendChild(h);

const p=document.createElement("p");
p.className="newsbody";
p.textContent=n.body||n.content||n.description||"";
a.appendChild(p);

if(share){
const url=location.href.split("#")[0]+"#news-"+id;
const text=h.textContent+"\n\n"+p.textContent+"\n\n"+url;

a.appendChild(makeButton("WhatsApp",()=>{
window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener");
},"whatsapp"));

a.appendChild(makeButton("Facebook",()=>{
window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url),"_blank","noopener");
},"facebook"));

a.appendChild(makeButton("Instagram",async()=>{
try{
await navigator.clipboard.writeText(text);
message("खबर कॉपी हो गई। Instagram में पेस्ट करें।");
window.open("https://www.instagram.com/","_blank","noopener");
}catch(e){message("कॉपी नहीं हो सकी।",true);}
},"instagram"));

a.appendChild(makeButton("Twitter / X",()=>{
window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(h.textContent)+"&url="+encodeURIComponent(url),"_blank","noopener");
},"twitter"));
}
return a;
}

async function loadPublic(){
try{
const q=query(collection(db,"news"),
where("status","==","published"));

const snap=await getDocs(q);
$("publicNews").replaceChildren();

if(snap.empty){
$("publicNews").textContent="अभी कोई प्रकाशित खबर नहीं है।";
}

const items=snap.docs.sort((a,b)=>
(b.data().publishedAt?.seconds||b.data().createdAt?.seconds||0)-
(a.data().publishedAt?.seconds||a.data().createdAt?.seconds||0));

items.forEach(d=>{
$("publicNews").appendChild(newsCard(d.id,d.data(),true));
});

if(location.hash){
document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
}catch(e){
$("publicNews").textContent="खबर पढ़ने में समस्या: "+e.message;
}
}

async function loadMine(){
const u=auth.currentUser;
if(!u)return;

try{
const q=query(collection(db,"news"),
where("authorUid","==",u.uid));

const snap=await getDocs(q);
$("myNews").replaceChildren();

if(snap.empty){
$("myNews").textContent="आपने अभी कोई खबर नहीं भेजी है।";
}

snap.forEach(d=>{
const a=newsCard(d.id,d.data());
const p=document.createElement("p");
p.textContent="स्थिति: "+d.data().status;
a.appendChild(p);
$("myNews").appendChild(a);
});
}catch(e){
$("myNews").textContent="मेरी खबरें पढ़ने की अनुमति नहीं: "+e.message;
}
}

async function loadAdmin(){
if(auth.currentUser?.uid!==ADMIN_UID)return;

try{
const q=query(collection(db,"news"),
where("status","==","pending"));

const snap=await getDocs(q);
$("pendingNews").replaceChildren();

if(snap.empty){
$("pendingNews").textContent="मंजूरी के लिए कोई खबर नहीं है।";
}

snap.forEach(d=>{
const a=newsCard(d.id,d.data());

a.appendChild(makeButton("प्रकाशित करें",async()=>{
try{
await updateDoc(doc(db,"news",d.id),{
status:"published",
publishedAt:serverTimestamp()
});
message("खबर प्रकाशित हो गई।");
await loadPublic();
await loadAdmin();
await loadMine();
}catch(e){message(e.message,true);}
}));

a.appendChild(makeButton("अस्वीकार करें",async()=>{
try{
await updateDoc(doc(db,"news",d.id),{
status:"rejected"
});
await loadAdmin();
await loadMine();
}catch(e){message(e.message,true);}
}));

$("pendingNews").appendChild(a);
});
}catch(e){
$("pendingNews").textContent="एडमिन अनुमति समस्या: "+e.message;
}
}

$("loginBtn").onclick=async()=>{
try{
await signInWithEmailAndPassword(
auth,$("email").value.trim(),
$("password").value
);
message("लॉगिन सफल।");
}catch(e){message("लॉगिन असफल: "+e.message,true);}
};

$("logoutBtn").onclick=()=>signOut(auth);

$("sendBtn").onclick=async()=>{
const u=auth.currentUser;
if(!u)return message("पहले लॉगिन करें।",true);

const title=$("headline").value.trim();
const body=$("body").value.trim();

if(!title||!body){
return message("शीर्षक और पूरी खबर लिखें।",true);
}

$("sendBtn").disabled=true;

try{
await addDoc(collection(db,"news"),{
title:title,
body:body,
content:body,
authorUid:u.uid,
status:"pending",
createdAt:serverTimestamp()
});

$("headline").value="";
$("body").value="";
message("खबर मंजूरी के लिए भेज दी गई है।");

await loadMine();
await loadAdmin();

}catch(e){
message("खबर भेजने में समस्या: "+e.message,true);
}finally{
$("sendBtn").disabled=false;
}
};

onAuthStateChanged(auth,async u=>{
$("loginPanel").hidden=!!u;
$("reporterPanel").hidden=!u;
$("adminPanel").hidden=!(u&&u.uid===ADMIN_UID);

$("myNews").replaceChildren();
$("pendingNews").replaceChildren();

if(u){
$("userInfo").textContent="लॉगिन: "+u.email;
await loadMine();
await loadAdmin();
}
await loadPublic();
});

</script>
</body>
</html>
