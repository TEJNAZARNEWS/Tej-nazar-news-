
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEJ NAZAR NEWS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}
header{background:#b90000;color:white;text-align:center;padding:22px 10px}
header h1{margin:0;font-size:30px}
header p{margin:8px}
nav{background:#10254a;padding:12px;text-align:center}
button{background:#b90000;color:white;border:0;padding:12px 18px;border-radius:6px;margin:4px;cursor:pointer;font-size:15px}
section{max-width:850px;margin:15px auto;padding:15px}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:6px;font-size:16px}
textarea{min-height:150px}
.panel,.card{background:white;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 2px 7px #ddd}
.card img{width:100%;border-radius:7px}
.card h2{color:#b90000}
.card p{white-space:pre-wrap;line-height:1.7}
small{color:#666}
.hidden{display:none}
footer{background:#10254a;color:white;text-align:center;padding:20px}
#status{padding:10px;text-align:center}
a{color:#0645ad}
</style>
</head>
<body>

<header>
<h1>TEJ NAZAR NEWS</h1>
<p>तेज़ नज़र न्यूज़</p>
<p>हर खबर पर तेज़ नज़र</p>
</header>

<nav>
<button id="homeBtn">होम</button>
<button id="loginBtn">एडमिन लॉगिन</button>
<button id="logoutBtn" class="hidden">लॉगआउट</button>
</nav>

<div id="status" role="status"></div>

<section id="login" class="hidden">
<div class="panel">
<h2>एडमिन लॉगिन</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="ईमेल" required>
<input id="password" type="password" placeholder="पासवर्ड" required>
<button type="submit">लॉगिन करें</button>
</form>
</div>
</section>

<section id="editor" class="hidden">
<div class="panel">
<h2>नई खबर प्रकाशित करें</h2>
<form id="newsForm">
<input id="headline" placeholder="खबर का शीर्षक" required>
<textarea id="story" placeholder="खबर का पूरा विवरण" required></textarea>
<input id="photo" type="url" placeholder="फोटो का HTTPS लिंक">
<input id="video" type="url" placeholder="वीडियो का HTTPS लिंक">
<button type="submit">खबर प्रकाशित करें</button>
</form>
</div>
</section>

<section id="newsSection">
<h2>🔴 ताज़ा खबरें</h2>
<div id="news">खबरें लोड हो रही हैं...</div>
</section>

<footer>
© TEJ NAZAR NEWS<br>
गिरिडीह, झारखंड
</footer>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot,
query,
orderBy,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBPsFE0AItJUnRrKh3G78JMiMnmhTzukNM",
authDomain: "tejnazarnews-f17b3.firebaseapp.com",
projectId: "tejnazarnews-f17b3",
appId: "1:776903715743:web:487cdac0caddaeb55febaa"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let user = null;
let articles = [];

function status(message){
$("status").textContent = message;
}

function validUrl(value){
if(!value) return true;
try{
return new URL(value).protocol === "https:";
}catch{
return false;
}
}

$("homeBtn").onclick = () => {
$("login").classList.add("hidden");
$("editor").classList.add("hidden");
$("newsSection").scrollIntoView();
};

$("loginBtn").onclick = () => {
$(user ? "editor" : "login").classList.remove("hidden");
};

$("loginForm").onsubmit = async e => {
e.preventDefault();
try{
await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);
$("loginForm").reset();
status("लॉगिन सफल।");
}catch(error){
status("लॉगिन असफल: " + error.code);
}
};

$("logoutBtn").onclick = async () => {
try{
await signOut(auth);
status("लॉगआउट सफल।");
}catch(error){
status(error.code);
}
};

onAuthStateChanged(auth, currentUser => {
user = currentUser;

$("login").classList.add("hidden");
$("editor").classList.toggle("hidden", !user);
$("logoutBtn").classList.toggle("hidden", !user);

$("loginBtn").textContent =
user ? "नई खबर लिखें" : "एडमिन लॉगिन";

render();
});

$("newsForm").onsubmit = async e => {
e.preventDefault();

if(!user){
status("पहले लॉगिन करें।");
return;
}

const title = $("headline").value.trim();
const body = $("story").value.trim();
const photo = $("photo").value.trim();
const video = $("video").value.trim();

if(!title || !body){
status("शीर्षक और खबर लिखें।");
return;
}

if(!validUrl(photo) || !validUrl(video)){
status("सही HTTPS लिंक डालें।");
return;
}

try{
await addDoc(collection(db,"news"),{
title,
body,
photo,
video,
authorUid:user.uid,
createdAt:serverTimestamp()
});

$("newsForm").reset();
status("खबर सफलतापूर्वक प्रकाशित हुई।");

}catch(error){
status("खबर प्रकाशित नहीं हुई: " + error.code);
}
};

const newsQuery = query(
collection(db,"news"),
orderBy("createdAt","desc")
);

onSnapshot(newsQuery,snapshot => {
articles = snapshot.docs.map(item => ({
id:item.id,
...item.data()
}));
render();
},error => {
status("Database समस्या: " + error.code);
$("news").textContent = "खबरें लोड नहीं हुईं।";
});

function render(){

const news = $("news");
news.replaceChildren();

if(!articles.length){
news.textContent = "अभी कोई खबर नहीं है।";
}

articles.forEach(a => {

const card = document.createElement("article");
card.className = "card";

const title = document.createElement("h2");
title.textContent = a.title;
card.appendChild(title);

const date = document.createElement("small");
date.textContent = a.createdAt?.toDate
? a.createdAt.toDate().toLocaleString("hi-IN")
: "";
card.appendChild(date);

if(a.photo && validUrl(a.photo)){
const img = document.createElement("img");
img.src = a.photo;
img.alt = "खबर की तस्वीर";
img.loading = "lazy";
card.appendChild(img);
}

const body = document.createElement("p");
body.textContent = a.body;
card.appendChild(body);

if(a.video && validUrl(a.video)){
const link = document.createElement("a");
link.href = a.video;
link.target = "_blank";
link.rel = "noopener noreferrer";
link.textContent = "▶ वीडियो देखें";
card.appendChild(link);
}

if(user && user.uid === a.authorUid){

const del = document.createElement("button");
del.textContent = "खबर डिलीट करें";

del.onclick = async () => {
if(!confirm("क्या खबर डिलीट करनी है?")) return;

try{
await deleteDoc(doc(db,"news",a.id));
status("खबर डिलीट हो गई।");
}catch(error){
status("डिलीट असफल: " + error.code);
}
};

card.appendChild(del);
}

news.appendChild(card);
});
}

</script>
</body>
</html>
