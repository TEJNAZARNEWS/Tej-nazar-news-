
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEJ NAZAR NEWS</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f3f6;
}
header{
background:#b90000;
color:white;
text-align:center;
padding:22px 10px;
}
header h1{margin:0;font-size:30px}
header h2{margin:8px}
nav{
background:#10234b;
padding:10px;
text-align:center;
}
button{
background:#b90000;
color:white;
border:0;
border-radius:6px;
padding:12px 18px;
margin:5px;
cursor:pointer;
font-size:15px;
}
main{
max-width:900px;
margin:auto;
padding:12px;
}
section,article{
background:white;
padding:18px;
margin:15px 0;
border-radius:10px;
box-shadow:0 2px 8px #0002;
}
input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}
textarea{min-height:140px}
img,video,iframe{
max-width:100%;
border-radius:6px;
}
footer{
background:#10234b;
color:white;
text-align:center;
padding:20px;
}
.hidden{display:none}
#message{
white-space:pre-wrap;
color:#b90000;
}
.breaking{
background:#ffdc00;
padding:12px;
text-align:center;
font-weight:bold;
}
.newsTitle{color:#b90000}
</style>
</head>

<body>

<header>
<h1>TEJ NAZAR NEWS</h1>
<h2>तेज़ नज़र न्यूज़</h2>
<p>गिरिडीह | झारखंड | देश-दुनिया</p>
</header>

<div class="breaking">
BREAKING NEWS | हर खबर पर तेज़ नज़र
</div>

<nav>
<button onclick="showNews()">ताज़ा खबरें</button>
<button onclick="showLogin()">रिपोर्टर / एडमिन लॉगिन</button>
</nav>

<main>

<p id="message"></p>

<section id="loginBox" class="hidden">
<h2>रिपोर्टर / एडमिन लॉगिन</h2>

<input id="email" type="email"
placeholder="ईमेल आईडी">

<input id="password" type="password"
placeholder="पासवर्ड">

<button onclick="login()">लॉगिन करें</button>

<button onclick="resetPassword()">
पासवर्ड भूल गए
</button>
</section>

<section id="dashboard" class="hidden">

<h2>न्यूज़ डैशबोर्ड</h2>

<p id="userEmail"></p>

<input id="newsTitle"
placeholder="खबर का शीर्षक">

<input id="location"
placeholder="स्थान">

<input id="reporter"
placeholder="रिपोर्टर का नाम">

<textarea id="description"
placeholder="खबर का पूरा विवरण"></textarea>

<input id="photo"
placeholder="फोटो का URL (वैकल्पिक)">

<input id="video"
placeholder="वीडियो का URL (वैकल्पिक)">

<button onclick="submitNews()">
खबर भेजें
</button>

<button onclick="myNews()">
मेरी भेजी खबरें
</button>

<button onclick="adminNews()">
एडमिन मंजूरी
</button>

<button onclick="logout()">
लॉगआउट
</button>

<div id="manageNews"></div>

</section>

<section id="publicNews">
<h2>ताज़ा समाचार</h2>
<div id="newsList">खबरें लोड हो रही हैं...</div>
</section>

</main>

<footer>
TEJ NAZAR NEWS<br>
तेज़ नज़र न्यूज़, गिरिडीह, झारखंड<br>
सर्वाधिकार सुरक्षित
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged,
sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
updateDoc,
doc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBPsFE0AItJUnRrKh3G78JMiMnmhTzukNM",
authDomain: "tejnazarnews-f17b3.firebaseapp.com",
projectId: "tejnazarnews-f17b3",
messagingSenderId: "776903715743",
appId: "1:776903715743:web:487cdac0caddaeb55febaa",
measurementId: "G-VBNQD24RRW"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

function message(text){
$("message").textContent=text;
}

window.showNews = function(){
$("loginBox").classList.add("hidden");
$("publicNews").scrollIntoView();
loadNews();
};

window.showLogin = function(){
if(auth.currentUser){
$("dashboard").scrollIntoView();
}else{
$("loginBox").classList.remove("hidden");
}
};

window.login = async function(){
try{
const email=$("email").value.trim();
const password=$("password").value;

await signInWithEmailAndPassword(
auth,email,password
);

message("लॉगिन सफल हुआ।");

}catch(e){
message("लॉगिन नहीं हुआ: "+e.code);
}
};

window.resetPassword = async function(){
try{
await sendPasswordResetEmail(
auth,$("email").value.trim()
);
message("पासवर्ड रीसेट लिंक भेज दिया गया।");
}catch(e){
message(e.code);
}
};

onAuthStateChanged(auth,user=>{
if(user){
$("loginBox").classList.add("hidden");
$("dashboard").classList.remove("hidden");
$("userEmail").textContent=user.email;
}else{
$("dashboard").classList.add("hidden");
$("manageNews").replaceChildren();
}
});

window.logout = async function(){
await signOut(auth);
message("लॉगआउट सफल।");
};

window.submitNews = async function(){

if(!auth.currentUser){
message("पहले लॉगिन करें।");
return;
}

const title=$("newsTitle").value.trim();
const description=$("description").value.trim();

if(!title || !description){
message("शीर्षक और विवरण भरें।");
return;
}

try{
await addDoc(collection(db,"news"),{
title:title,
description:description,
location:$("location").value.trim(),
reporter:$("reporter").value.trim(),
photo:$("photo").value.trim(),
video:$("video").value.trim(),
uid:auth.currentUser.uid,
email:auth.currentUser.email,
status:"pending",
createdAt:serverTimestamp()
});

message("खबर एडमिन की मंजूरी के लिए भेज दी गई।");

["newsTitle","description","location",
"reporter","photo","video"].forEach(id=>{
$(id).value="";
});

}catch(e){
message("खबर नहीं भेजी गई: "+e.code);
}
};

function safeUrl(value){
try{
const url=new URL(value);
return url.protocol==="https:" ? url.href : "";
}catch{
return "";
}
}

function renderNews(container,item){
const n=item.data();
const article=document.createElement("article");

const title=document.createElement("h2");
title.className="newsTitle";
title.textContent=n.title || "";
article.appendChild(title);

const info=document.createElement("p");
info.textContent=
(n.location || "")+" | "+(n.reporter || "");
article.appendChild(info);

const photo=safeUrl(n.photo);
if(photo){
const img=document.createElement("img");
img.src=photo;
img.loading="lazy";
article.appendChild(img);
}

const description=document.createElement("p");
description.style.whiteSpace="pre-wrap";
description.textContent=n.description || "";
article.appendChild(description);

const video=safeUrl(n.video);
if(video){
const link=document.createElement("a");
link.href=video;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="वीडियो देखें";
article.appendChild(link);
}

container.appendChild(article);
return article;
}

async function displayNews(q,container,mode){
const snapshot=await getDocs(q);
container.replaceChildren();

const items=snapshot.docs.sort((a,b)=>
(b.data().createdAt?.seconds || 0)-
(a.data().createdAt?.seconds || 0)
);

if(!items.length){
container.textContent="अभी कोई खबर उपलब्ध नहीं है।";
}

items.forEach(item=>{
const article=renderNews(container,item);

if(mode==="mine"){
const p=document.createElement("p");
p.textContent="स्थिति: "+item.data().status;
article.appendChild(p);
}

if(mode==="admin"){
const btn=document.createElement("button");
btn.textContent="खबर प्रकाशित करें";
btn.onclick=()=>approveNews(item.id);
article.appendChild(btn);
}
});
}

async function loadNews(){
try{
await displayNews(
query(collection(db,"news"),
where("status","==","published")),
$("newsList"),"public"
);
}catch(e){
$("newsList").textContent=
"खबरें लोड नहीं हुईं: "+e.code;
}
}

window.myNews = async function(){
if(!auth.currentUser)return;
try{
await displayNews(
query(collection(db,"news"),
where("uid","==",auth.currentUser.uid)),
$("manageNews"),"mine"
);
}catch(e){
message(e.code);
}
};

window.adminNews = async function(){
if(!auth.currentUser)return;

try{
await displayNews(
query(collection(db,"news"),
where("status","==","pending")),
$("manageNews"),"admin"
);
}catch(e){
message("एडमिन अनुमति आवश्यक है: "+e.code);
}
};

async function approveNews(id){
try{
await updateDoc(doc(db,"news",id),{
status:"published",
publishedAt:serverTimestamp()
});
message("खबर प्रकाशित हो गई।");
await window.adminNews();
await loadNews();
}catch(e){
message("प्रकाशन की अनुमति नहीं मिली: "+e.code);
}
}

loadNews();

</script>

</body>
</html>
